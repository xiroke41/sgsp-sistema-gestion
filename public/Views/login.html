<section class="view-shell login-view" data-view="login">
  <div class="login-panel">
    <div class="workspace-brand"><span class="brand-mark">S</span><strong>SGSP INDUSTRIAL</strong></div>
    <p class="eyebrow">Acceso operativo</p>
    <h1>Iniciar sesión</h1>
    <p class="lede">Ingresa para acceder a la operación de tu planta.</p>
    <form id="loginForm" class="view-form">
      <label class="form-label" for="username">Usuario</label>
      <input class="field-control" id="username" autocomplete="username" required>
      <label class="form-label" for="password">Contraseña</label>
      <input class="field-control" id="password" type="password" autocomplete="current-password" required>
      <button class="native-button native-button-primary full-width spaced-top" type="submit">Iniciar sesión</button>
      <div id="loginError" class="login-error" role="alert"></div>
    </form>
  </div>
</section>
