<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Colaborador - Opción 2</title>
    <style>
        :root {
            --bg-base: #0D1117;
            --bg-surface: #161B22;
            --bg-card: #21262D;
            --border-color: #30363D;
            --border-focus: #FFB800;
            --text-main: #C9D1D9;
            --text-muted: #8B949E;
            --accent-yellow: #FFB800;
            --accent-cyan: #58A6FF;
            --font-stack: 'Segoe UI', system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-stack); }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        aside { width: 220px; background: var(--bg-surface); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .brand { padding: 18px; font-weight: 800; font-size: 1.1rem; color: var(--accent-yellow); border-bottom: 1px solid var(--border-color); letter-spacing: 1px; }
        .nav-menu { list-style: none; padding: 10px 0; }
        .nav-item a { display: block; padding: 10px 18px; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; border-left: 3px solid transparent; }
        .nav-item.active a { color: #FFF; background: var(--bg-card); border-left-color: var(--accent-yellow); }

        /* Wrapper */
        .wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { height: 50px; background: var(--bg-surface); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .header-status { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

        /* Main Content */
        main { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .top-bar h2 { font-size: 1.3rem; font-weight: 700; color: #FFF; }
        
        /* Form Two Columns Layout */
        .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card-module { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 4px; padding: 18px; display: flex; flex-direction: column; gap: 15px; }
        .module-title { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; color: var(--accent-yellow); letter-spacing: 1px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

        .field-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        input, select { background: var(--bg-surface); border: 1px solid var(--border-color); color: #FFF; padding: 8px 10px; font-size: 0.85rem; border-radius: 3px; outline: none; }
        input:focus, select:focus { border-color: var(--border-focus); }

        /* Bottom Control Panel */
        .bottom-actions { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 4px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; border-radius: 3px; cursor: pointer; border: none; }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
        .btn-save { background: var(--accent-yellow); color: #000; }

        /* Footer */
        footer { height: 30px; background: var(--bg-surface); border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 0.7rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <aside>
        <div class="brand">PLANT_OS</div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="#">Inicio</a></li>
            <li class="nav-item active"><a href="#">Personal</a></li>
            <li class="nav-item"><a href="#">Producción</a></li>
        </ul>
    </aside>

    <div class="wrapper">
        <header>
            <div class="header-status">MODO EDICIÓN ACTIVADO</div>
            <div class="header-status">ID REGISTRO: #COL-8821</div>
        </header>

        <main>
            <div class="top-bar">
                <h2>Editar Ficha de Colaborador</h2>
            </div>

            <form style="display: flex; flex-direction: column; gap: 20px;">
                <div class="columns-grid">
                    <!-- Columna Izquierda: Datos de Catálogo -->
                    <div class="card-module">
                        <div class="module-title">Catálogo Personal (3FN)</div>
                        <div class="field-group">
                            <label>RUT (Identificador Único)</label>
                            <input type="text" value="19.876.543-2" disabled>
                        </div>
                        <div class="field-group">
                            <label>Nombres</label>
                            <input type="text" value="Bastián">
                        </div>
                        <div class="field-group">
                            <label>Apellidos</label>
                            <input type="text" value="Borjes">
                        </div>
                        <div class="field-group">
                            <label>Tipo Perfil</label>
                            <input type="text" value="Planta / Producción">
                        </div>
                    </div>

                    <!-- Columna Derecha: Configuración de Colaborador -->
                    <div class="card-module">
                        <div class="module-title">Datos Laborales</div>
                        <div class="field-group">
                            <label>ID Colaborador</label>
                            <input type="text" value="1042" disabled>
                        </div>
                        <div class="field-group">
                            <label>Cargo</label>
                            <select>
                                <option>Operador de Consola</option>
                                <option selected>Jefe de Turno</option>
                                <option>Técnico Mantención</option>
                            </select>
                        </div>
                        <div class="field-group">
                            <label>Fecha Ingreso</label>
                            <input type="date" value="2025-12-01">
                        </div>
                        <div class="field-group">
                            <label>Curriculum (Ruta PDF)</label>
                            <input type="text" value="/docs/cv/198765432.pdf">
                        </div>
                    </div>
                </div>

                <!-- Footer de Acciones Flotante/Contenido -->
                <div class="bottom-actions">
                    <span style="font-size: 0.75rem; color: var(--text-muted);">Última modificación: 2026-05-18 10:30 hrs</span>
                    <div class="btn-group">
                        <button type="button" class="btn btn-cancel">Descartar</button>
                        <button type="submit" class="btn btn-save">Actualizar Registro</button>
                    </div>
                </div>
            </form>
        </main>

        <footer>
            <span>SISTEMA DE CONTROL DE PLANTA</span>
            <span>ESTADO: CONECTADO</span>
        </footer>
    </div>

</body>
</html>
