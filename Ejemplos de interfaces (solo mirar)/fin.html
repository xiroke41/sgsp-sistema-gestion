<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre de Turno - Panel Unificado</title>
    <style>
        :root {
            --bg-dark: #090a0f;
            --panel-bg: #12151e;
            --border-tech: #232836;
            --accent-blue: #0066ff;
            --accent-green: #00e676;
            --text-main: #f0f3f8;
            --text-muted: #7e8b9b;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card-center {
            background: var(--panel-bg);
            border: 1px solid var(--border-tech);
            border-top: 4px solid var(--accent-blue);
            border-radius: 8px;
            width: 500px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .full-width { grid-column: span 2; }
        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #08090c;
            border: 1px solid var(--border-tech);
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .display-result {
            background: #08090c;
            border: 1px dashed var(--accent-green);
            padding: 16px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .result-title { font-size: 0.85rem; color: var(--text-muted); }
        .result-value { font-size: 1.6rem; color: var(--accent-green); font-weight: bold; }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-blue);
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card-center">
    <div class="header-panel">
        <h3 style="margin: 0; font-size: 1.2rem;">Finalizar Cierre de Turno</h3>
        <span style="font-size: 0.75rem; background: #1c2230; color: #a0aec0; padding: 4px 8px; border-radius: 4px;">Puntero ID: T-1042</span>
    </div>

    <div class="grid-inputs">
        <div class="full-width">
            <label>Seleccionar Turno</label>
            <select><option>T-1042 - Turno Noche (Línea 2)</option></select>
        </div>
        <div>
            <label>Kilos Procesados</label>
            <input type="number" value="5600">
        </div>
        <div>
            <label>Giveaway (%)</label>
            <input type="number" step="0.01" value="0.06">
        </div>
    </div>

    <div class="display-result">
        <div>
            <div class="result-title">Tramo 10 (Óptimo)</div>
            <div style="font-size: 0.75rem; color: #00e676;">Cumplimiento Rendimiento</div>
        </div>
        <div class="result-value">$7.337</div>
    </div>

    <button class="btn-submit">CONFIRMAR Y FINALIZAR</button>
</div>

</body>
</html>
