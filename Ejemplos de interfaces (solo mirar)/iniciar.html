<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar Proceso - Opción 3</title>
<style>
  :root {
    --bg-dark: #090a0f;
    --card-dark: #12141d;
    --border-dark: #1f2330;
    --text-main: #d1d5db;
    --accent-cyan: #06b6d4;
  }
  body { margin: 0; background-color: var(--bg-dark); color: var(--text-main); font-family: Segoe UI, sans-serif; }
  .wrapper { max-width: 600px; margin: 60px auto; padding: 20px; }
  .panel { background: var(--card-dark); border: 1px solid var(--border-dark); border-radius: 10px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
  .panel-header { margin-bottom: 25px; text-align: center; }
  .panel-title { font-size: 1.3rem; font-weight: 700; color: #fff; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 1px; }
  .panel-subtitle { font-size: 0.85rem; color: #6b7280; }
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; color: #9ca3af; }
  input, select { width: 100%; padding: 12px; background: #0a0b10; border: 1px solid var(--border-dark); color: #fff; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
  input:focus, select:focus { border-color: var(--accent-cyan); outline: none; box-shadow: 0 0 8px rgba(6, 182, 212, 0.2); }
  .btn-submit { width: 100%; padding: 14px; background: var(--accent-cyan); color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; margin-top: 10px; transition: opacity 0.2s; }
  .btn-submit:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="panel">
    <div class="panel-header">
      <h2 class="panel-title">Apertura de Proceso</h2>
      <p class="panel-subtitle">Ingrese los datos para habilitar la línea de producción</p>
    </div>
    <form>
      <div class="form-group">
        <label>ID del Turno Activo</label>
        <input type="text" value="TRN-2026-0919" readonly style="color: #6b7280; cursor: not-allowed;">
      </div>
      <div class="form-group">
        <label>Estación de Trabajo</label>
        <select required>
          <option value="">Seleccione Estación...</option>
          <option value="E1">Estación 01 - Calibrado</option>
          <option value="E2">Estación 02 - Empaque</option>
        </select>
      </div>
      <div class="form-group">
        <label>Orden de Trabajo / Lote</label>
        <input type="text" placeholder="Ej. LOTE-4592" required>
      </div>
      <button type="submit" class="btn-submit">Confirmar e Iniciar</button>
    </form>
  </div>
</div>
</body>
</html>
