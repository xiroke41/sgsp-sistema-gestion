<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGSP - Diseño Minimalista Industrial</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1E40AF;
      --success: #10B981;
      --dark: #1F2937;
      --bg: #F8FAFC;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--dark);
      margin: 0;
      padding: 40px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      max-width: 400px;
      border-top: 4px solid var(--primary);
    }
    .badge {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">SISTEMA ACTIVO</span>
    <h2 style="color: var(--dark);">Control de Turnos SGSP</h2>
    <p style="color: #6B7280; font-size: 0.9rem;">Plataforma de gestión operativa de empaque y rendimiento.</p>
    <button class="btn">Ingresar al Módulo</button>
  </div>
</body>
</html>
